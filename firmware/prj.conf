# Builds and runs on real hardware (XIAO nRF52840 + SSD1683) — see firmware/README.md.
# Kconfig names drift between Zephyr releases, so expect to revisit this if you move to a
# different NCS version than the one it was brought up against.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HomeScreen Display"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
# App logic only ever treats one connection as active at a time (spec 4.1/4.2) — this is
# 2, not 1, purely so the connection-object pool has a spare slot. With exactly 1, the
# just-disconnected object hadn't always finished being reclaimed internally by the time
# the next advertising cycle started, so bt_le_adv_start() kept returning -ENOMEM ("no
# free connection objects available for connectable advertiser") on real hardware — a
# known Zephyr BT host timing gap, not something app-level retry logic can wait out
# reliably (see zephyrproject-rtos/zephyr#90111, Nordic DevZone thread 109942).
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=0

# No bonding/pairing in v1 (spec 1, spec 8) — trusted local network, small device count.
CONFIG_BT_SMP=n

# Raise the negotiable ATT MTU well past the 23-byte default so data_transfer chunks
# (spec 4.3) aren't limited to ~13 payload bytes each. The gateway reads the connection's
# actual negotiated MTU at runtime (BleConnection.mtu_payload_size) rather than assuming
# this ceiling is always reached.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Power management: lets the idle thread pick the SoC's deepest available sleep state
# during DEEP_SLEEP (k_msleep in main.c) automatically. Deliberately NOT calling
# sys_poweroff() for true System OFF — on nRF52840, System OFF drops power to the RTC
# peripheral, so it cannot wake on an RTC timer, only GPIO/LPCOMP/NFC (see docs/
# protocol.md's note on this if added, or Nordic's nRF52840 Product Specification,
# System OFF section). System ON's deepest sleep state keeps LFCLK+RTC alive for the
# RTC-driven wake this design needs, at only a small current cost versus true System OFF
# (Nordic's datasheet: ~1.5uA with full RAM retention vs ~0.3uA for System OFF) — this is
# what the spec's "System OFF (or the lowest sleep state that supports RTC wake)" phrase
# is actually pointing at.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

CONFIG_WATCHDOG=y

CONFIG_ADC=y

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_REBOOT=y

# LVGL (v9.5, bundled with NCS at modules/lib/gui/lvgl) as the text/shape renderer,
# replacing the hand-authored 8x8 bitmap font in font_basic.h. The point is not the
# widget toolkit — it's real proportional fonts with real glyph metrics, so what the
# design editor previews in the browser and what the panel actually prints can be made
# to agree. Nothing here routes the panel through Zephyr's display subsystem; see
# boards/xiao_ble.overlay's `zephyr,display` comment for why a dummy display node
# exists, and lvgl_render.c for how the real lv_display is created and flushed.
CONFIG_DISPLAY=y
CONFIG_LVGL=y

# RGB565. Not LV_COLOR_DEPTH_1 (which would look like the obvious choice for a mono
# panel): LVGL 9's I1 draw path is far less exercised than the 16-bit one, and the
# render happens once per wake into a buffer we threshold ourselves anyway, so the
# extra byte per pixel costs a transient buffer, not power or refresh time. Revisit if
# RAM gets tight.
CONFIG_LV_COLOR_DEPTH_16=y

CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_16=y

# LVGL's internal log. Off by default (LV_Z_LOG_LEVEL=0), which means LVGL's own error
# and assert messages — including allocation failures out of LV_Z_MEM_POOL_SIZE — are
# discarded rather than printed, so a failed render looks identical to a render that
# simply drew nothing. Routed into Zephyr's log via the module's lv_log_register_print_cb,
# which it only installs when LV_Z_LOG_LEVEL != 0.
# Don't assign LV_Z_LOG_LEVEL directly — it has no prompt and is derived from the level
# choice below (WARN => 2), so setting it is a hard Kconfig error.
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y

# LVGL's internal heap, used for object/style/draw-task allocation. Sized generously for
# bring-up rather than measured; lv_mem_monitor() is the way to trim it once the real
# full-panel render path exists.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# USB CDC ACM console. Note this needs almost nothing here: the board's own defconfig
# (zephyr/boards/common/usb/Kconfig.cdc_acm_serial.defconfig, pulled in because
# xiao_ble_common.dtsi includes common/usb/cdc_acm_serial.dtsi) already sets
# BOARD_SERIAL_BACKEND_CDC_ACM=y, which turns on SERIAL/CONSOLE/UART_CONSOLE, selects the
# *next* USB device stack, and initializes CDC ACM at boot. The console was therefore
# available all along — this project simply never used it, and diagnosed bring-up
# problems from what the e-paper did or didn't show instead (see lvgl_spike.c's note
# about debugging "on hardware with no serial console"). The board enumerates as
# /dev/cu.usbmodem* on macOS.
#
# Do NOT add CONFIG_USB_DEVICE_STACK=y here: that is the *legacy* stack, and enabling it
# alongside the next one makes both bind the same devicetree cdc-acm-uart node, which
# fails at link time with "multiple definition of __device_dts_ord_N".
#
# UART_LINE_CTRL is the one thing not already on (its default tracks SHELL, which this
# app doesn't use). main.c's wait_for_console() needs it to poll DTR.
CONFIG_UART_LINE_CTRL=y

# Log lines produced before the host opens the CDC port are dropped — CDC ACM discards
# writes while nothing is attached — which would lose exactly the boot-time messages
# worth reading, including anything LVGL's SYS_INIT (LV_Z_AUTO_INIT, APPLICATION
# priority) emits before main() runs. Deferred logging buffers messages and a dedicated
# thread drains them; delaying that thread's first run lets the queue accumulate until
# main()'s wait_for_console() has seen DTR, so the backlog flushes into an attached
# terminal instead of a closed pipe. The board defconfig already defaults this to 4000ms;
# pinned explicitly here and kept in step with CONSOLE_WAIT_TIMEOUT_MS in main.c.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2500

# LVGL's initialization runs as SYS_INIT(lvgl_init, APPLICATION, LV_Z_INIT_PRIORITY),
# i.e. on the main thread's stack before main() is entered, and LVGL's rendering is
# stack-hungry besides. At the previous default of 2048 the very first LVGL-enabled build
# never reached main() at all: the panel kept its pre-existing content, meaning
# epaper_init()'s unconditional blank-frame push never ran. With HW_STACK_PROTECTION=y an
# overflow there is an MPU fault, which on a board that isn't enumerating USB yet looks
# exactly like a silent hang.
CONFIG_MAIN_STACK_SIZE=8192
